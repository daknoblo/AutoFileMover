services:
  autofilemover:
    image: ghcr.io/daknoblo/autofilemover:stable
    container_name: autofilemover
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AFM_HTTP_ADDR: ":8080"
      AFM_DB_PATH: "/appdata/autofilemover.db"
      AFM_MEDIA_ROOT: "/dataroot"
      # Wie lange ein Download unverändert bleiben muss, bevor er verarbeitet wird.
      AFM_STABILITY_WINDOW: "30s"
      # Fallback-Scan-Intervall; der Watcher reagiert zusätzlich in Echtzeit.
      AFM_SCAN_INTERVAL: "5m"
      AFM_LOG_LEVEL: "info"
      TZ: "Europe/Berlin"
      # Optional: KI-Endpoint und Deployments aus Azure AI Foundry ermitteln.
      # Sobald eine dieser Variablen gesetzt ist, entfallen Base-URL, API-Version
      # und API-Key in der UI; stattdessen wird ein Deployment ausgewählt.
      # AZURE_RESOURCE_ID: "/subscriptions/<id>/resourceGroups/<group>/providers/Microsoft.CognitiveServices/accounts/<account>"
      # AZURE_TENANT_ID: "<tenant-uuid>"
      # AZURE_CLIENT_ID: "<client-uuid>"
      # Das Clientgeheimnis nur über die Umgebung setzen, z. B. aus einer .env-Datei.
      # AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"
    # Optional passend zum Medienordner setzen, damit verschobene Dateien die
    # erwarteten Besitzer-/Gruppenrechte erhalten.
    # user: "1000:1000"
    volumes:
      # Persistente SQLite-Datenbank.
      - autofilemover-data:/appdata
      # Medienwurzel mit Downloads und Zielbibliotheken; Pfade in der UI liegen
      # innerhalb von AFM_MEDIA_ROOT (/dataroot).
      - /srv/media:/dataroot
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  autofilemover-data:
