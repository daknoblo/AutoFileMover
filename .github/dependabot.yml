version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "gomod"
  - package-ecosystem: "gomod"
    directory: "/tools/site"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "gomod"
  - package-ecosystem: "npm"
    directory: "/tools/screenshots"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "npm"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
