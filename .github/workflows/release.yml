name: Release

on:
  push:
    branches: [main, develop]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Push, Sign & Scan
    runs-on: ubuntu-latest
    permissions:
      # contents: write is needed to publish the GitHub release for a tag.
      contents: write
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image ref
        id: image-ref
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive build metadata
        id: build-meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            channel="stable"
          elif [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
            version="develop-${GITHUB_SHA:0:7}"
            channel="dev"
          else
            version="main-${GITHUB_SHA:0:7}"
            channel="stable"
          fi
          semver="${version#v}"
          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "commit=${GITHUB_SHA:0:7}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "semver=${semver}"
            echo "minor=$(echo "$semver" | cut -d. -f1,2)"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-meta.outputs.version }}
            CHANNEL=${{ steps.build-meta.outputs.channel }}
            COMMIT=${{ steps.build-meta.outputs.commit }}
            DATE=${{ steps.build-meta.outputs.date }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.image-ref.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image-ref.outputs.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF to Security tab
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # Uses the pre-installed gh CLI rather than a third-party action to keep
      # the release path free of extra supply-chain surface.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image-ref.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SEMVER: ${{ steps.build-meta.outputs.semver }}
          MINOR: ${{ steps.build-meta.outputs.minor }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          {
            printf '## Container image\n\n'
            printf '```\ndocker pull %s:%s\n```\n\n' "$IMAGE" "$SEMVER"
            printf 'Also tagged `%s`, `stable` and `latest`. Built for `linux/amd64`\n' "$MINOR"
            printf 'and `linux/arm64`, signed keyless with cosign and published with an SBOM.\n\n'
            printf 'Digest: `%s`\n\n' "$DIGEST"
            printf 'Verify the signature:\n\n'
            printf '```\ncosign verify %s@%s \\\n' "$IMAGE" "$DIGEST"
            printf "  --certificate-identity-regexp '^https://github.com/%s/' \\\\\n" "$REPO"
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n```\n'
          } > notes.md
          # A tag containing a hyphen (v1.2.0-rc1) marks a pre-release.
          case "$TAG" in
            *-*) gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes --prerelease ;;
            *)   gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes ;;
          esac
